name: 🚀 Deploy ChatRealtime to AWS EC2

on:
  push:
    branches:
      - deploy       

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy code mới nhất
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập Node.js để kiểm tra build frontend (optional)
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Bước 3: Kiểm tra build frontend trước khi deploy
      - name: 🧱 Build frontend (test build)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Bước 4: Deploy bằng SSH (appleboy)
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/chat-realtime-group11
            echo "🔄 Pulling latest code..."
            git pull origin main
            echo "🧱 Rebuilding Docker containers..."
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            echo "✅ Deployment complete!"
