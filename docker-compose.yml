version: "3.8"

services:
  backend:
    build: ./backend
    container_name: chat-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: always
    networks:
      - app-network

  frontend:
  build:
    context: ./frontend
    args:
      VITE_API_BASE_URL: http://backend:3000
  container_name: chat-frontend
  ports:
    - "5173:80"     # giờ cổng 5173 trỏ vào port 80 của nginx
  depends_on:
    - backend
  restart: always
  networks:
    - app-network


networks:
  app-network:
    driver: bridge
